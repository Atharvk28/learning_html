<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>input types</title>
</head>
<body>
  <h2>Input types</h2>

  <form action="">
    <label for="">Enter Your Name </label>
    <input type="text" placeholder="Enter Your Name">
      <br><br>


    <label for="">Enter your email</label>
    <input type="email" placeholder="Enter email">

    <br><br>
    <label for="">Enter Your Aadhar number</label>
    <input type="number" placeholder="Aadhar number">

    <br><br>
    <label for="">Enter the Password</label>
    <input type="password" placeholder="Enter Password">

    <br><br>
    <label for="">Enter DOB</label>
    <input type="date">

    <br><br>
    <label for="">Enter the Month</label>
    <input type="month">

    <br><br>
    <label for="">Enter the Week </label>
    <input type="week">

    <br><br>
    <label for="">Enter the Time</label>
    <input type="time">

    <br><br>
    <label for="">Enter the Date and time</label>
    <input type="datetime-local">

    <br><br>
    <h2>Checkbox</h2>
    <label for="">Choose the Cities:</label>
    <input type="checkbox" name="city"id="">Mumbai
    <input type="checkbox" name="city" id="">Pune
    <input type="checkbox" name="city" id="">Jalna
    <input type="checkbox" name="city" id="">Beed

    <br><br>
    <h2>Radio button</h2>
    <label for="">Choose the Gender:</label>
    <input type="radio" name="gender">male
    <input type="radio" name="gender">female
    <input type="radio" name="gender">other

    <br><br>
    <h3>Select color</h3>
    <label for="">Select color</label>
    <input type="color" name="" id="">

    <br><br>
    <h3>Range</h3>
    <label for="">select Range</label>
    <input type="range">

    <br><br>
    <h3>Select Document</h3>
    <label for="">Upload file:</label>
    <input type="file">

    <br><br>
    <h3>Search</h3>
    <label for="">Search</label>
    <input type="search" name="" id="" placeholder="Type to search">

    <br><br>
    <h3>Tel phone</h3>
    <label for="">Tel-phone</label>
    <input type="tel" name="" id="" placeholder="020-95632586">

    <br><br>
    <h3>selection input</h3>
    <label for="">select the city:</label>
    <select name="" id="">
      <option value="">Choose your city....</option>
      <option value="">Mumbai</option>
      <option value="">Pune</option>
      <option value="">Nashik</option>
      <option value="">Jalgaon</option>
      <option value="">Nagpur</option>
    </select>

    <br><br>
    <h3>Text box</h3>
    <label for="address">address</label>
    <textarea name="address" id="" rows="3" cols="13"></textarea>

    <br><br>
    <h3>Input submit and reset</h3>
    <input type="button" value="submit">type "button"
    <br><br>
    <input type="submit" value="submit">type "submit"
      <br><br>
      <input type="reset">reset form
  </form>
</body>
</html>
