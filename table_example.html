<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RowSpan attribute</title>
</head>
<body>
  <h2>Table rowspan example</h2>
  <table border="2">
    <thead>
      <tr>
        <th>Language</th>
        <th>Details</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td rowspan="5">Web Design</td>
        <td>HTML</td>
      </tr>

      <tr>
        <td>CSS</td>
      </tr>

      <tr>
        <td>Bootstrap</td>
      </tr>

      <tr>
        <td></td>
      </tr>

      <tr>
        <td>CSS</td>
      </tr>

      <tr>
        <td rowspan="4">Graphic Design</td>
        <td>Adobe Photoshop</td>
      </tr>

      <tr>
        <td></td>
      </tr>
    </tbody>
  
  </table>

  <hr>

  <h2>table colspan example</h2>

  <table border="2">
    <thead>
      <tr>
        <th colspan="4">Web Design</th>
        <th colspan="4">Graphic Design</th>
      </tr>
    </thead>

    <tbody>
      <tr>
        <td>html</td>
        <td>css</td>
        <td>bootstrap</td>
        <td>Java Script</td>
        <td>Adobe</td>
        <td>figma</td>
        <td></td>
      </tr>
        
    </tbody>
   
  </table>
</body>
</html>
